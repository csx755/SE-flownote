services:
  postgres:
    image: postgres:16-alpine
    container_name: flownote-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: flownote
      POSTGRES_PASSWORD: flownote
      POSTGRES_DB: flownote
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U flownote -d flownote']
      interval: 3s
      timeout: 3s
      retries: 5

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: flownote-api
    restart: unless-stopped
    ports:
      - '3000:3000'
    environment:
      DATABASE_URL: postgresql://flownote:flownote@postgres:5432/flownote
      JWT_SECRET: docker-dev-secret-change-in-production
      PORT: '3000'
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
