services:
  postgres:
    image: postgres:16-alpine
    container_name: flownote-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: flownote
      POSTGRES_PASSWORD: flownote
      POSTGRES_DB: flownote
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
